name: Build Windows Installer

# Manual only — triggered from the Actions tab ("Run workflow") when you
# want a fresh .exe to hand to testers, not on every push. Runs on a real
# Windows runner so better-sqlite3 (a native module) gets rebuilt against
# actual Windows, not cross-compiled from Mac/Linux.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build Windows installer
        run: npm run build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: kumite-windows-installer
          path: release/**/*.exe
